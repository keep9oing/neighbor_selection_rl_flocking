control:
    speed: 15.0
#    max_turn_rate: 8/15
    initial_position_bound: 250.0
#    beta: 1./3.
    lam: 5.
    sig: 1.
    k1: 1.
    k2: 3.
    r0: 60.
    rho: 1.0

env:
    num_agents_pool: [20]  # Must be specified
    # action_type options:
    #   "binary_vector"  - per-step (N,N) binary adjacency over all neighbors (default)
    #   "neighbor_index" - per-agent ONE neighbor index (self allowed); applied only at step 0 and frozen
    #                      for the rest of the episode. Selected neighbors = those with dist <= dist(i, anchor_i).
    # action_type: binary_vector